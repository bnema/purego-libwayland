name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --init
    steps:
      - run: pacman -Syu --noconfirm --needed git go make gcc wayland
      - uses: actions/checkout@v4
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go version
          test "$(go env GOVERSION | cut -d. -f1-2)" = go1.27
      - run: make check
      - run: make race

  bindings:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --init
    permissions:
      contents: read
    steps:
      - run: pacman -Syu --noconfirm --needed git go gcc wayland
      - uses: actions/checkout@v4
        with:
          path: purego-libwayland
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bnema/go-wayland-bindings
          ref: main
          path: bindings
          persist-credentials: false
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/purego-libwayland"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/bindings"
          go version
          test "$(go env GOVERSION | cut -d. -f1-2)" = go1.27
      - name: Build and test go-wayland-bindings against this checkout
        working-directory: bindings
        run: |
          go mod edit -replace bnema.dev/purego-libwayland=../purego-libwayland
          go mod tidy
          CGO_ENABLED=0 go build ./...
          go vet ./server/...
          CGO_ENABLED=0 go test ./server/... ./internal/e2e/...
